
<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>WU鉴名表｜订单查询</title>


<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Microsoft YaHei", sans-serif;
    background: #f5f5f5;
    color: #1c1c1c;
}


/* =========================
   Header
========================= */

.brand-header {

    position: relative;

    background: #111;

    color: white;

    text-align: center;

    padding: 32px 20px 28px;

}


.brand-name {

    font-size: 32px;

    font-weight: 700;

    letter-spacing: 4px;

    margin-bottom: 8px;

}


.brand-subtitle {

    font-size: 12px;

    letter-spacing: 3px;

    color: #bbb;

}



/* =========================
   Language Toggle
========================= */

.language-toggle {

    position: absolute;

    top: 18px;

    right: 20px;

    display: flex;

    background: #2a2a2a;

    border: 1px solid #444;

    border-radius: 20px;

    padding: 3px;

}


.lang-button {

    border: none;

    background: transparent;

    color: #aaa;

    padding: 7px 11px;

    border-radius: 17px;

    font-size: 12px;

    cursor: pointer;

}


.lang-button.active {

    background: white;

    color: #111;

}



/* =========================
   Main
========================= */

.container {

    max-width: 560px;

    margin: 30px auto;

    padding: 0 18px 40px;

}


.card {

    background: white;

    border-radius: 18px;

    padding: 30px 24px;

    box-shadow:
        0 6px 30px rgba(0,0,0,0.08);

}


h1 {

    text-align: center;

    margin: 0 0 10px;

    font-size: 26px;

}


.subtitle {

    text-align: center;

    color: #777;

    margin-bottom: 30px;

    font-size: 14px;

}



/* =========================
   Inputs
========================= */

label {

    display: block;

    margin-top: 18px;

    margin-bottom: 8px;

    font-weight: 600;

    font-size: 14px;

}


input {

    width: 100%;

    padding: 14px 15px;

    border: 1px solid #ddd;

    border-radius: 10px;

    font-size: 16px;

    outline: none;

}


input:focus {

    border-color: #111;

}


.input-hint {

    margin-top: 6px;

    font-size: 12px;

    color: #999;

}



/* =========================
   Button
========================= */

.search-button {

    width: 100%;

    margin-top: 25px;

    padding: 15px;

    border: none;

    border-radius: 10px;

    background: #111;

    color: white;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;

}


.search-button:hover {

    opacity: 0.88;

}



/* =========================
   Results
========================= */

#result {

    margin-top: 28px;

}


.result-summary {

    padding: 14px 16px;

    margin-bottom: 16px;

    background: #edf8f0;

    color: #147a35;

    border-radius: 10px;

    font-weight: 700;

}



/* =========================
   Individual Order
========================= */

.order-card {

    border: 1px solid #e5e5e5;

    border-radius: 14px;

    padding: 20px;

    margin-bottom: 18px;

    background: #fafafa;

}


.order-card:last-child {

    margin-bottom: 0;

}


.order-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    margin-bottom: 14px;

}


.order-number {

    font-size: 19px;

    font-weight: 700;

}


.order-date {

    font-size: 12px;

    color: #888;

}


.row {

    padding: 11px 0;

    border-bottom: 1px solid #e8e8e8;

}


.label {

    color: #777;

    font-size: 12px;

    margin-bottom: 5px;

}


.value {

    font-size: 16px;

    font-weight: 600;

}



/* =========================
   Status
========================= */

.status {

    display: inline-block;

    padding: 7px 12px;

    border-radius: 20px;

    font-size: 13px;

}


.status.shipped {

    background: #dff5e5;

    color: #147a35;

}


.status.pending {

    background: #fff1cf;

    color: #875d00;

}



/* =========================
   Tracking
========================= */

.tracking-section {

    margin-top: 16px;

    padding: 16px;

    background: #fffaf0;

    border: 1px solid #f0e1bd;

    border-radius: 11px;

}


.tracking-title {

    font-weight: 700;

    margin-bottom: 5px;

}


.tracking-instruction {

    color: #777;

    font-size: 12px;

    margin-bottom: 12px;

}


.tracking-link {

    display: block;

    text-align: center;

    padding: 13px;

    background: #111;

    color: white;

    text-decoration: none;

    border-radius: 9px;

    font-size: 14px;

}


.tracking-link:hover {

    opacity: 0.85;

}



/* =========================
   Error
========================= */

.error {

    color: #b42318;

    background: #fff1f0;

    border-radius: 10px;

    text-align: center;

    padding: 15px;

}



/* =========================
   Footer
========================= */

.footer {

    text-align: center;

    color: #999;

    font-size: 12px;

    margin-top: 25px;

}



/* =========================
   Mobile
========================= */

@media (max-width: 600px) {

    .brand-header {

        padding-top: 65px;

    }


    .brand-name {

        font-size: 27px;

    }


    .language-toggle {

        top: 15px;

        right: 15px;

    }


    .container {

        margin-top: 20px;

    }


    .card {

        padding: 25px 18px;

    }


    .order-header {

        display: block;

    }


    .order-date {

        margin-top: 5px;

    }

}

</style>

</head>


<body>


<!-- =========================
     Header
========================= -->

<div class="brand-header">


    <div class="language-toggle">

        <button
            id="zhButton"
            class="lang-button active"
            onclick="changeLanguage('zh')"
        >
            中文
        </button>


        <button
            id="enButton"
            class="lang-button"
            onclick="changeLanguage('en')"
        >
            EN
        </button>

    </div>


    <!-- 店名不翻译 -->

    <div class="brand-name">
        WU鉴名表
    </div>


    <div class="brand-subtitle">
        LUXURY WATCHES
    </div>


</div>



<!-- =========================
     Main
========================= -->

<div class="container">


<div class="card">


    <h1 id="pageTitle">
        订单查询
    </h1>


    <div
        id="pageSubtitle"
        class="subtitle"
    >
        请输入您的姓名和手机号码查询订单状态
    </div>



    <!-- Name -->

    <label id="nameLabel">
        姓名
    </label>


    <input
        id="name"
        type="text"
        placeholder="请输入姓名"
    >


    <div
        id="nameHint"
        class="input-hint"
    >
        无视大小写
    </div>



    <!-- Phone -->

    <label id="phoneLabel">
        手机号码
    </label>


    <input
        id="phone"
        type="tel"
        placeholder="0123333333"
    >


    <div
        id="phoneHint"
        class="input-hint"
    >
        格式：0123333333
    </div>



    <!-- Search -->

    <button
        id="searchButton"
        class="search-button"
        onclick="searchOrder()"
    >
        查询订单
    </button>



    <div id="result"></div>


</div>



<div class="footer">

    © 2026 WU鉴名表

</div>


</div>



<script>


/*
=========================================
Current Language
=========================================
*/

let currentLanguage = "zh";

let lastOrders = null;



/*
=========================================
Translations
=========================================
*/

const translations = {


    zh: {

        title:
            "订单查询",

        subtitle:
            "请输入您的姓名和手机号码查询订单状态",

        name:
            "姓名",

        namePlaceholder:
            "请输入姓名",

        nameHint:
            "无视大小写",

        phone:
            "手机号码",

        phoneHint:
            "格式：0123333333",

        search:
            "查询订单",

        searching:
            "查询中...",

        enterDetails:
            "请输入姓名和手机号码",

        notFound:
            "找不到订单，请检查姓名和手机号码",

        systemError:
            "系统暂时无法查询，请稍后再试。",

        foundOne:
            "✓ 找到 1 个订单",

        foundMultiple:
            count => `✓ 找到 ${count} 个订单`,

        orderNo:
            "订单号码",

        orderDate:
            "下单日期",

        customerName:
            "客户姓名",

        orderStatus:
            "订单状态",

        trackingNo:
            "物流单号",

        shipped:
            "已发货",

        pending:
            "尚未发货",

        trackingTitle:
            "🚚 订单追踪",

        trackingInstruction:
            "点击链接以追踪订单状态",

        trackingButton:
            "点击这里追踪订单"

    },



    en: {

        title:
            "Order Tracking",

        subtitle:
            "Enter your name and phone number to check your order status",

        name:
            "Name",

        namePlaceholder:
            "Enter your name",

        nameHint:
            "Not case-sensitive",

        phone:
            "Phone Number",

        phoneHint:
            "Format: 0123333333",

        search:
            "Check Order",

        searching:
            "Searching...",

        enterDetails:
            "Please enter your name and phone number",

        notFound:
            "Order not found. Please check your name and phone number.",

        systemError:
            "Unable to check your order at the moment. Please try again later.",

        foundOne:
            "✓ 1 Order Found",

        foundMultiple:
            count => `✓ ${count} Orders Found`,

        orderNo:
            "Order Number",

        orderDate:
            "Order Date",

        customerName:
            "Customer Name",

        orderStatus:
            "Order Status",

        trackingNo:
            "Tracking Number",

        shipped:
            "Shipped",

        pending:
            "Pending for Shipment",

        trackingTitle:
            "🚚 Order Tracking",

        trackingInstruction:
            "Click the link below to track your order status",

        trackingButton:
            "Track My Order"

    }

};



/*
=========================================
Change Language
=========================================
*/

function changeLanguage(language) {


    currentLanguage =
        language;


    const t =
        translations[language];


    document.documentElement.lang =
        language === "zh"
            ? "zh-CN"
            : "en";


    document
        .getElementById("pageTitle")
        .textContent =
        t.title;


    document
        .getElementById("pageSubtitle")
        .textContent =
        t.subtitle;


    document
        .getElementById("nameLabel")
        .textContent =
        t.name;


    document
        .getElementById("name")
        .placeholder =
        t.namePlaceholder;


    document
        .getElementById("nameHint")
        .textContent =
        t.nameHint;


    document
        .getElementById("phoneLabel")
        .textContent =
        t.phone;


    document
        .getElementById("phoneHint")
        .textContent =
        t.phoneHint;


    document
        .getElementById("searchButton")
        .textContent =
        t.search;



    document
        .getElementById("zhButton")
        .classList.toggle(
            "active",
            language === "zh"
        );


    document
        .getElementById("enButton")
        .classList.toggle(
            "active",
            language === "en"
        );



    /*
    已经查询后切换语言，
    不需要重新查询
    */

    if (lastOrders) {

        displayOrders(
            lastOrders
        );

    }

}



/*
=========================================
Search
=========================================
*/

async function searchOrder() {


    const t =
        translations[currentLanguage];


    const name =
        document
            .getElementById("name")
            .value
            .trim();


    const phone =
        document
            .getElementById("phone")
            .value
            .trim();


    const result =
        document
            .getElementById("result");



    if (!name || !phone) {


        result.innerHTML = `

            <div class="error">

                ${t.enterDetails}

            </div>

        `;


        return;

    }



    result.innerHTML = `

        <div style="
            text-align:center;
            padding:15px;
        ">

            ${t.searching}

        </div>

    `;



    try {


        const response =
            await fetch(

                "/api/order?name=" +

                encodeURIComponent(name) +

                "&phone=" +

                encodeURIComponent(phone)

            );



        const data =
            await response.json();



        if (!data.success) {


            lastOrders = null;


            result.innerHTML = `

                <div class="error">

                    ${
                        response.status === 404
                            ? t.notFound
                            : t.systemError
                    }

                </div>

            `;


            return;

        }



        lastOrders =
            data.orders;



        displayOrders(
            data.orders
        );


    }

    catch (error) {


        console.error(error);


        lastOrders = null;


        result.innerHTML = `

            <div class="error">

                ${t.systemError}

            </div>

        `;

    }

}



/*
=========================================
Display Orders
=========================================
*/

function displayOrders(orders) {


    const t =
        translations[currentLanguage];


    const result =
        document
            .getElementById("result");



    /*
    Summary
    */

    const summary =

        orders.length === 1

        ? t.foundOne

        : t.foundMultiple(
            orders.length
        );



    /*
    Build all orders
    */

    const ordersHTML =
        orders.map(order => {


            /*
            Status
            */

            let statusClass = "";

            let statusText =
                order.status;



            if (
                order.status === "已发货" ||
                order.status === "Shipped"
            ) {

                statusClass =
                    "shipped";

                statusText =
                    t.shipped;

            }


            else if (
                order.status === "尚未发货" ||
                order.status === "Pending for Shipment"
            ) {

                statusClass =
                    "pending";

                statusText =
                    t.pending;

            }



            /*
            Tracking Number
            */

            let trackingNumber = "";


            if (
                order.status === "已发货" &&
                order.trackingNo
            ) {


                trackingNumber = `

                    <div class="row">

                        <div class="label">
                            ${t.trackingNo}
                        </div>

                        <div class="value">
                            ${order.trackingNo}
                        </div>

                    </div>

                `;

            }



            /*
            Tracking Button

            只有 Shipped 才显示
            */

            let trackingSection = "";


            if (
                order.status === "已发货"
            ) {


                trackingSection = `

                    <div class="tracking-section">


                        <div class="tracking-title">

                            ${t.trackingTitle}

                        </div>


                        <div class="tracking-instruction">

                            ${t.trackingInstruction}

                        </div>


                        <a
                            class="tracking-link"

                            href="http://120.79.172.107:555/"

                            target="_blank"

                            rel="noopener noreferrer"
                        >

                            ${t.trackingButton}

                        </a>


                    </div>

                `;

            }



            /*
            Order Date
            */

            let dateDisplay =
                order.orderDate || "-";


            if (order.orderDate) {


                const date =
                    new Date(
                        order.orderDate
                    );


                if (!isNaN(date)) {


                    dateDisplay =
                        date.toLocaleDateString(

                            currentLanguage === "zh"
                                ? "zh-MY"
                                : "en-MY"

                        );

                }

            }



            /*
            Individual Card
            */

            return `

                <div class="order-card">


                    <div class="order-header">


                        <div class="order-number">

                            ${order.orderNo}

                        </div>


                        <div class="order-date">

                            ${t.orderDate}:
                            ${dateDisplay}

                        </div>


                    </div>



                    <div class="row">

                        <div class="label">

                            ${t.customerName}

                        </div>


                        <div class="value">

                            ${order.name}

                        </div>

                    </div>



                    <div class="row">

                        <div class="label">

                            ${t.orderStatus}

                        </div>


                        <div class="value">

                            <span
                                class="
                                    status
                                    ${statusClass}
                                "
                            >

                                ${statusText}

                            </span>

                        </div>

                    </div>



                    ${trackingNumber}


                    ${trackingSection}


                </div>

            `;


        }).join("");



    /*
    Show Everything
    */

    result.innerHTML = `


        <div class="result-summary">

            ${summary}

        </div>


        ${ordersHTML}


    `;

}



/*
=========================================
Press Enter
=========================================
*/

document
    .getElementById("phone")
    .addEventListener(

        "keydown",

        function(event) {

            if (
                event.key === "Enter"
            ) {

                searchOrder();

            }

        }

    );


</script>


</body>

</html>
