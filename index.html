<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WU鉴名表｜订单查询</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            color: #1c1c1c;
        }

        /* 品牌顶部 */
        .brand-header {
            background: #111;
            color: white;
            text-align: center;
            padding: 32px 20px 28px;
        }

        .brand-name {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        .brand-subtitle {
            font-size: 12px;
            letter-spacing: 3px;
            color: #bbb;
        }

        .container {
            max-width: 520px;
            margin: 30px auto;
            padding: 0 18px 40px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 30px 24px;
            box-shadow: 0 6px 30px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin: 0 0 10px;
            font-size: 26px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #111;
        }

        .search-button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .search-button:hover {
            opacity: 0.88;
        }

        #result {
            margin-top: 25px;
        }

        .result-box {
            background: #f8faf8;
            border: 1px solid #e4eee6;
            border-radius: 14px;
            padding: 20px;
        }

        .success-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .row {
            padding: 12px 0;
            border-bottom: 1px solid #e8e8e8;
        }

        .row:last-of-type {
            border-bottom: none;
        }

        .label {
            color: #777;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .value {
            font-size: 17px;
            font-weight: 600;
        }

        .status {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            background: #e9e9e9;
            font-size: 14px;
        }

        .status.shipped {
            background: #dff5e5;
            color: #147a35;
        }

        .status.pending {
            background: #fff1cf;
            color: #875d00;
        }

        /* 订单追踪区域 */
        .tracking-section {
            margin-top: 20px;
            padding: 18px;
            background: #fffaf0;
            border: 1px solid #f0e1bd;
            border-radius: 12px;
        }

        .tracking-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .tracking-instruction {
            color: #777;
            font-size: 13px;
            margin-bottom: 14px;
        }

        .tracking-link {
            display: block;
            width: 100%;
            text-align: center;
            padding: 14px 10px;
            background: #111;
            color: white;
            text-decoration: none;
            border-radius: 9px;
            font-size: 14px;
            word-break: break-all;
        }

        .tracking-link:hover {
            opacity: 0.85;
        }

        .error {
            color: #b42318;
            background: #fff1f0;
            border-radius: 10px;
            text-align: center;
            padding: 15px;
        }

        .footer {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 25px;
        }

        @media (max-width: 600px) {
            .brand-name {
                font-size: 27px;
            }

            .container {
                margin-top: 20px;
            }

            .card {
                padding: 25px 18px;
            }
        }
    </style>
</head>

<body>

    <!-- WU鉴名表 -->
    <div class="brand-header">
        <div class="brand-name">WU鉴名表</div>
        <div class="brand-subtitle">LUXURY WATCHES</div>
    </div>

    <div class="container">

        <div class="card">

            <h1>订单查询</h1>

            <div class="subtitle">
                请输入您的姓名和手机号码查询订单状态
            </div>

            <label>姓名</label>
            <input
                type="text"
                id="name"
                placeholder="请输入姓名"
            >

            <label>手机号码</label>
            <input
                type="tel"
                id="phone"
                placeholder="例如：0128888888"
            >

            <button
                class="search-button"
                onclick="searchOrder()"
            >
                查询订单
            </button>

            <div id="result"></div>

        </div>

        <div class="footer">
            © 2026 WU鉴名表
        </div>

    </div>


<script>

async function searchOrder() {

    const name =
        document.getElementById("name").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const result =
        document.getElementById("result");

    if (!name || !phone) {

        result.innerHTML = `
            <div class="error">
                请输入姓名和手机号码
            </div>
        `;

        return;
    }

    result.innerHTML = `
        <div style="text-align:center;padding:15px;">
            查询中...
        </div>
    `;

    try {

        const response = await fetch(
            "/api/order?name=" +
            encodeURIComponent(name) +
            "&phone=" +
            encodeURIComponent(phone)
        );

        const data = await response.json();

        if (!data.success) {

            result.innerHTML = `
                <div class="error">
                    ${data.message || "找不到订单"}
                </div>
            `;

            return;
        }

        const order = data.order;

        /*
         * 根据状态改变颜色
         */
        let statusClass = "";

        if (order.status === "已发货") {
            statusClass = "shipped";
        }

        if (order.status === "尚未发货") {
            statusClass = "pending";
        }


        /*
         * Tracking Number
         * 只有存在 Tracking No 才显示
         */
        let trackingNumber = "";

        if (order.trackingNo) {

            trackingNumber = `
                <div class="row">
                    <div class="label">
                        Tracking No.
                    </div>

                    <div class="value">
                        ${order.trackingNo}
                    </div>
                </div>
            `;
        }


        result.innerHTML = `

            <div class="result-box">

                <div class="success-title">
                    ✓ 找到您的订单
                </div>


                <div class="row">

                    <div class="label">
                        订单号码
                    </div>

                    <div class="value">
                        ${order.orderNo}
                    </div>

                </div>


                <div class="row">

                    <div class="label">
                        客户姓名
                    </div>

                    <div class="value">
                        ${order.name}
                    </div>

                </div>


                <div class="row">

                    <div class="label">
                        订单状态
                    </div>

                    <div class="value">

                        <span class="status ${statusClass}">
                            ${order.status}
                        </span>

                    </div>

                </div>


                ${trackingNumber}


                <!-- 订单追踪 -->

                <div class="tracking-section">

                    <div class="tracking-title">
                        🚚 订单追踪
                    </div>

                    <div class="tracking-instruction">
                        点击链接以追踪订单状态
                    </div>

                    <a
                        class="tracking-link"
                        href="http://120.79.172.107:555/"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        点击这里追踪订单
                    </a>

                </div>

            </div>
        `;

    }

    catch (error) {

        console.error(error);

        result.innerHTML = `
            <div class="error">
                系统暂时无法查询，请稍后再试。
            </div>
        `;
    }
}


/*
 * 手机按 Enter 也可以查询
 */

document
    .getElementById("phone")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            searchOrder();
        }

    });

</script>

</body>
</html>
